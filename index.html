const routines={push:['Landmine Press','Bench Press','Incline Smith Machine Press','Incline Dumbbell Press','Dips','Lateral Raise Combo (Lateral / Front / Overhead Press)','Tricep Extension','Tricep Pushdown'],pull:['Weighted Pull-up','Seated Cable Row','Barbell Row','Face Pull','Rear Delt Cable Fly','Cable Biceps Curl','Hammer Curl','Wrist Combo (Curl / Reverse Curl / Twist)'],leg:['Jump Squat','Deadlift','Leg Press','Lunge Combo','Leg Extension','Leg Curl','Calf Kick','Abs']};const I=p=>`<svg class="i" viewBox="0 0 24 24">${p}</svg>`;const colors={push:'#ff9ea8',pull:'#8edcff',leg:'#a6ed9d'},icons={push:I('<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>'),pull:I('<path d="M3 4h18M8 4v5M16 4v5"/><circle cx="12" cy="12" r="2.6"/><path d="M9 21v-3.5a3 3 0 0 1 6 0V21"/>'),leg:I('<path d="M4 20h5v-5h5v-5h6"/><path d="M15 5h5v5M20 5l-6 6"/>')},IC={cal:I('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'),home:I('<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>'),stats:I('<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'),set:I('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'),next:I('<path d="M9 6l6 6-6 6"/>')};let view='home',routine='push',date=todayStr();let data={};try{data=JSON.parse(localStorage.getItem('dzGymLogV2')||'{}')}catch{}const app=document.getElementById('app');const fmt=d=>d.split('-').reverse().join('/');const key=(r,d,i)=>`${r}_${d}_${i}`;const stored=(r,d,i)=>data[key(r,d,i)]||{};function persist(){localStorage.setItem('dzGymLogV2',JSON.stringify(data))}function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const has=v=>v&&(v.set||v.rep||v.kg);
function sessions(r){const s=new Set();for(const k of Object.keys(data)){const m=k.match(/^([a-z]+)_(\d{4}-\d\d-\d\d)_\d+$/);if(m&&m[1]===r&&has(data[k]))s.add(m[2])}return[...s].sort()}
function prev(r,i){for(const d of sessions(r).filter(x=>x<date).reverse()){const v=stored(r,d,i);if(has(v))return{...v,d}}return null}
function suggest(p){if(!p)return null;const rs=String(p.rep||'').split(/[\/,\s-]+/).map(parseFloat).filter(n=>!isNaN(n));const kg=parseFloat(String(p.kg||'').replace(',','.'));const set=p.set||'';if(!rs.length)return{set,rep:p.rep||'',kg:p.kg||''};const lo=Math.min(...rs);if(isNaN(kg))return{set,rep:String(lo+1),kg:''};if(lo>=12){const st=kg<20?1:2.5;return{set,rep:'8',kg:String(+(kg+st).toFixed(1))}}return{set,rep:String(lo+1),kg:String(kg)}}
const cap=r=>r[0].toUpperCase()+r.slice(1);function edit(r,i,field,val){if(!allowTrainingEdit(r))return;const k=key(r,date,i);data[k]??={};data[k][field]=val;persist()}const prog=r=>routines[r].filter((_,i)=>{const v=stored(r,date,i);return v.set||v.rep||v.kg}).length;
function homeHeader() {
  const weekdays = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
  const weekday = weekdays[new Date(date + 'T12:00:00').getDay()];
  return `<header class="home-header">
    <div class="brand">
      <span class="logo" aria-hidden="true">${icons.push}</span>
      <h1>DZ <span>GYM LOG</span></h1>
    </div>
    <time class="range" datetime="${date}">
      <span class="range-icon" aria-hidden="true">${IC.cal}</span>
      <span><small>${weekday}</small><strong>${fmt(date)}</strong></span>
    </time>
  </header>`;
}
function footer(active){return `<nav class="foot" aria-label="Điều hướng chính">${tabs.map(([v,ic,t])=>`<button class="${active===v?'active':''}" ${active===v?'aria-current="page"':''} onclick="nav('${v}')"><span class="foot-icon">${ic}</span><span class="foot-label">${t}</span></button>`).join('')}</nav>`}
const routineFocus = { push: 'Ngực · Vai · Tay sau', pull: 'Lưng · Vai sau · Tay trước', leg: 'Chân · Mông · Bụng' };
const routineLock = I('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4m-4 4v2"/>');

function home() {
  const active = loggedRoutine(date);
  const schedules = Object.keys(routines).map(r => ({ r, restriction: routineRestriction(r, date) }));
  const available = schedules.filter(({ restriction }) => !restriction).length;
  const cards = schedules.map(({ r, restriction }) => {
    const last = sessions(r).filter(day => day < date).pop();
    const detail = restriction || (active === r ? 'Lịch đang tập' : last ? 'Lần trước ' + fmt(last).slice(0, 5) : 'Chưa ghi buổi trước');
    return `<button class="workcard ${r}${active === r ? ' current' : ''}" ${restriction ? 'disabled' : `onclick="nav('work','${r}')"`}>
      <span class="emoji" aria-hidden="true">${icons[r]}</span>
      <span class="workcard-intro"><strong>${cap(r)}</strong><span class="workcard-focus">${routineFocus[r]}</span></span>
      <span class="arrow" aria-hidden="true">${restriction ? routineLock : IC.next}</span>
      <span class="workcard-status">${detail}</span>
    </button>`;
  }).join('');
  const progress = active ? prog(active) : 0;
  const total = active ? routines[active].length : 0;
  app.innerHTML = `<div class="home">
    ${homeHeader()}
    <section class="hero" aria-labelledby="today-title">
      <div class="hero-copy">
        <h2 id="today-title">Tập luyện <span>hôm nay</span></h2>
        ${active ? `<div class="hero-progress ${active}">
          <div class="hero-progress-label"><strong>${cap(active)}</strong><span>${progress}/${total} bài đã ghi</span></div>
          <div class="bar hero-meter" role="progressbar" aria-label="Số bài đã ghi" aria-valuenow="${progress}" aria-valuemax="${total}">
            <u style="width:${progress / total * 100}%"></u>
          </div>
        </div>` : `<p>${available ? 'Chọn lịch để bắt đầu buổi tập.' : 'Các lịch đang trong thời gian nghỉ.'}</p>`}
      </div>
      <div class="hero-media">
        <img src="training-hero.jpg?v=7954d46" alt="" fetchpriority="high">
      </div>
    </section>
    <section class="home-routines" aria-labelledby="routines-title">
      <div class="home-routines-heading">
        <h2 id="routines-title">Lịch tập</h2>
        ${active ? '' : `<span class="routine-count">${available} lịch khả dụng</span>`}
      </div>
      <div class="cards">${cards}</div>
    </section>
  </div>${footer('home')}`;
}
function loggedRoutine(day) {
  return dayTypes(day)[0] || Object.keys(routines).find(r => gym[r + '_' + day]);
}
function offsetTrainingDay(day, offset) {
  const shifted = new Date(day + 'T00:00:00Z');
  shifted.setUTCDate(shifted.getUTCDate() + offset);
  return shifted.toISOString().slice(0, 10);
}
function routineRestriction(r, day) {
  const active = loggedRoutine(day);
  if (active === r) return '';
  if (active) return `Hôm nay đã ghi ${cap(active)}`;
  for (const offset of [1, 2]) {
    const previous = offsetTrainingDay(day, -offset);
    if (dayTypes(previous).includes(r) || gym[r + '_' + previous]) {
      return `Tập lại từ ${fmt(offsetTrainingDay(previous, 3))}`;
    }
  }
  return '';
}
function allowTrainingEdit(r) {
  if (date === todayStr() && !routineRestriction(r, date)) return true;
  closeKeypad();
  nav('home');
  return false;
}
const exerciseFields = [
  ['set', 'Set', 'Số set'],
  ['rep', 'Rep', 'Số rep'],
  ['kg', 'Kg', 'Số kg']
];

function exerciseCard(name, index, entry, previous, suggested) {
  return `<article class="exercise${has(entry) ? ' done' : ''}" data-i="${index}" aria-labelledby="exercise-title-${index}">
    <header class="exhead">
      <span class="n">${index + 1}</span>
      <h3 class="exercise-title" id="exercise-title-${index}">${esc(name)}</h3>
      <span class="exercise-recorded"><span aria-hidden="true">✓</span> Đã ghi</span>
    </header>
    <div class="prevcol">
      <span class="previous-label">${IC.cal} Lần trước</span>
      ${previous ? `<div class="previous-metrics">
        <b>${esc(previous.set || '–')} × ${esc(previous.rep || '–')}</b>
        <span>${previous.kg ? esc(previous.kg) + ' kg' : 'tạ thân'}</span>
      </div><time datetime="${esc(previous.d)}">${fmt(previous.d).slice(0, 5)}</time>` : '<span class="previous-empty">Chưa có</span>'}
    </div>
    <div class="exbody">
      ${exerciseFields.map(([field, title, label]) => `<label class="exercise-field" data-field="${field}">
        <span aria-hidden="true">${title}</span>
        <input aria-label="${label} ${esc(name)}" data-field="${field}" readonly inputmode="none" placeholder="—"
          value="${esc(entry[field] ?? '')}" oninput="edit('${routine}',${index},'${field}',this.value)">
      </label>`).join('')}
    </div>
    ${suggested ? `<button class="sug" type="button">
      <b>Gợi ý hôm nay: ${esc(suggested.set || '–')} × ${esc(suggested.rep || '–')} · ${suggested.kg ? esc(suggested.kg) + ' kg' : 'tạ thân'}</b>
      <span>Dùng</span>
    </button>` : ''}
  </article>`;
}

function work() {
  const last = sessions(routine).filter(day => day < date).pop();
  const exercises = routines[routine].map((name, index) => {
    const previous = prev(routine, index);
    return { name, index, previous, suggested: suggest(previous) };
  });
  const completed = prog(routine);
  app.innerHTML = `<div class="top ${routine}">
    <div class="topline">
      <button class="back" aria-label="Về trang chủ" onclick="nav('home')">‹</button>
      <span class="ticon">${icons[routine]}</span>
      <div><h2>${cap(routine)}</h2><p>Hôm nay ${fmt(date)}${last ? ' · lần trước ' + fmt(last).slice(0, 5) : ' · buổi đầu tiên'}</p></div>
    </div>
    <div class="tprog"><span>${completed}/8 bài đã ghi</span><em class="bar"><u style="width:${completed * 12.5}%"></u></em></div>
  </div>
  <div class="paper" style="--ac:${colors[routine]}">
    ${exercises.some(exercise => exercise.suggested) ? `<button class="sugall" onclick="document.querySelectorAll('.sug').forEach(button => button.click())">Dùng tất cả gợi ý cho hôm nay</button>` : ''}
    ${exercises.map(({ name, index, previous, suggested }) => exerciseCard(name, index, stored(routine, date, index), previous, suggested)).join('')}
    ${gymPanel()}
    <button class="save ${routine}" onclick="if(!allowTrainingEdit(routine))return;persist();this.textContent='✓ Đã lưu';setTimeout(()=>this.textContent='✓ Lưu bài tập',1200)">✓ Lưu bài tập</button>
    <p class="mini">Dữ liệu tự lưu khi nhập. Lần sau tập ${cap(routine)}, số liệu hôm nay sẽ hiện ở cột "Lần trước". Gợi ý: đạt 12 rep thì tăng tạ (2.5 kg, hoặc 1 kg nếu dưới 20 kg) và về 8 rep; chưa đạt thì giữ tạ và thêm 1 rep. Bạn vẫn sửa tự do. Rep nhập dạng 8, 8/10/10 hoặc Max.</p>
  </div>${footer('')}`;
}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}function count(){return Object.keys(data).filter(k=>Object.values(data[k]||{}).some(v=>String(v).trim())).length}function dayTypes(d){return Object.keys(routines).filter(r=>routines[r].some((_,i)=>{let v=stored(r,d,i);return v.set||v.rep||v.kg}))}function stats() {
  const per = Object.keys(routines).map(r => ({ r, n: sessions(r).length, last: sessions(r).pop() }));
  const mx = Math.max(1, ...per.map(p => p.n));
  renderPagedView('Thống kê', 'Theo dõi quá trình tập luyện', [
    ['Buổi tập', `<h2>${new Set(per.flatMap(p=>sessions(p.r))).size} ngày đã ghi</h2>${per.map(({r,n,last})=>`<div class="srow"><i class="${r}">${icons[r]}</i><div><strong>${cap(r)} <small class="hint">· gần nhất ${last?fmt(last).slice(0,5):'chưa có'}</small></strong><em class="bar"><u style="width:${n*100/mx}%;background:${colors[r]}"></u></em></div><b>${n}</b></div>`).join('')}<p class="hint">Mỗi buổi là một ngày có ghi ít nhất một bài của lịch đó.</p>`],
    ['Dự báo cân nặng', energyForecast()],
    ['Biểu đồ', analytics()]
  ]);
}
function settings() {
  renderPagedView('Cài đặt', 'Hồ sơ và dữ liệu tập luyện', [
    ['Hồ sơ cơ thể', profilePanel()],
    ['Quản lý dữ liệu', `<div class="settings"><h2>Quản lý dữ liệu</h2>${installed()?'':`<button class="install" onclick="installApp()">Cài app lên màn hình chính</button>`}<button onclick="exportJSON()">Sao lưu dữ liệu (JSON)</button><label class="filebtn">Khôi phục từ file sao lưu<input type="file" accept=".json,application/json" hidden onchange="importJSON(this.files[0])"></label><button onclick="exportCSV()">Xuất dữ liệu CSV</button><button class="danger" onclick="if(confirm('Xóa toàn bộ dữ liệu đã ghi?')){data={};persist();render()}">Xóa toàn bộ ghi chú</button><p class="hint">Dữ liệu lưu trên trình duyệt hiện tại. Nếu xóa dữ liệu trình duyệt, ghi chú có thể mất. Hãy xuất CSV để sao lưu.</p></div>`]
  ]);
}
function exportCSV(){const rows=[['Lịch','Ngày','Bài tập','Set','Rep','Kg']];for(const r of Object.keys(routines))for(const day of sessions(r))routines[r].forEach((name,i)=>{const v=stored(r,day,i);if(has(v))rows.push([r,day,name,v.set||'',v.rep||'',v.kg||''])});const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='DZ-Gym-Log.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}const analyticsFilters = { volume: 'all', exercise: 'push:0' };
const chartNumber = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 2 });

function recordedNumber(value) {
  const text = String(value ?? '').trim();
  return /^\d+(?:[.,]\d+)?$/.test(text) ? Number(text.replace(',', '.')) : NaN;
}

function exerciseMetrics(entry) {
  const weight = recordedNumber(entry.kg);
  const sets = recordedNumber(entry.set);
  const repText = String(entry.rep ?? '').trim();
  const reps = repText.split('/').map(recordedNumber);
  const validReps = reps.every(value => Number.isInteger(value) && value > 0);
  const maxReps = validReps ? Math.max(...reps) : NaN;
  const validSets = Number.isInteger(sets) && sets > 0;
  let total = NaN;
  if (validReps && reps.length > 1 && (!String(entry.set ?? '').trim() || sets === reps.length)) {
    total = reps.reduce((sum, value) => sum + value, 0);
  } else if (validReps && reps.length === 1 && validSets) {
    total = sets * reps[0];
  }
  return {
    weight,
    reps: maxReps,
    volume: weight > 0 ? weight * total : NaN,
    progress: weight > 0 ? weight * maxReps : NaN
  };
}

function combinedChart(volume, progress, start, end, unit) {
  if (!volume.length && !progress.length) return '<p class="hint">Chưa có số liệu phù hợp trong khoảng này.</p>';
  const dayOffset = day => (Date.parse(day) - Date.parse(start)) / 86400000;
  const toPairs = points => points.map(({ day, value }) => [dayOffset(day), value]);
  const [[volumeTicks, volumeCoords], [progressTicks, progressCoords], dates, left, right, bottom] =
    trainingChart.layout(toPairs(volume), toPairs(progress), dayOffset(end));
  const grid = volumeTicks.map(([, y]) => `<line x1="${left}" x2="${right}" y1="${y}" y2="${y}"/>`).join('');
  const axis = (ticks, x, anchor, color) => `<g class="${color}">${ticks.map(([value, y]) =>
    `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle">${chartNumber.format(value)}</text>`
  ).join('')}</g>`;
  const labels = dates.map(([offset, x]) =>
    `<text x="${x}" y="${bottom + 19}" text-anchor="middle">${fmt(offsetTrainingDay(start, offset)).slice(0, 5)}</text>`
  ).join('');
  const draw = (coords, points, pointUnit, color) => `<g class="${color}">
    <polyline points="${coords.map(([x, y]) => `${x},${y}`).join(' ')}"/>
    ${coords.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="3.6"><title>${fmt(points[i].day)} · ${chartNumber.format(points[i].value)} ${pointUnit}</title></circle>`).join('')}
  </g>`;
  const volumeByDay = new Map(volume.map(({ day, value }) => [day, value]));
  const progressByDay = new Map(progress.map(({ day, value }) => [day, value]));
  const days = [...new Set([...volumeByDay.keys(), ...progressByDay.keys()])].sort();
  const cell = (values, day) => values.has(day) ? chartNumber.format(values.get(day)) : '—';
  return `<div class="line-chart">
    <div class="chart-legend">
      <span class="chart-volume">Volume · kg × rep${volume.length ? '' : ' · Chưa có dữ liệu'}</span>
      <span class="chart-progress">Tăng tiến · ${unit}${progress.length ? '' : ' · Chưa có dữ liệu'}</span>
    </div>
    <svg viewBox="0 0 400 198" aria-hidden="true">
      ${volume.length ? `<g class="chart-volume"><text x="${left - 7}" y="13" text-anchor="end">kg × rep</text></g>` : ''}
      ${progress.length ? `<g class="chart-progress"><text x="${right + 7}" y="13">${unit}</text></g>` : ''}
      <g class="chart-grid">${grid}</g>
      <line x1="${left}" x2="${right}" y1="${bottom}" y2="${bottom}" stroke="#9aabba" vector-effect="non-scaling-stroke"/>
      ${labels}
      ${volume.length ? axis(volumeTicks, left - 7, 'end', 'chart-volume') + draw(volumeCoords, volume, 'kg × rep', 'chart-volume') : ''}
      ${progress.length ? axis(progressTicks, right + 7, 'start', 'chart-progress') + draw(progressCoords, progress, unit, 'chart-progress') : ''}
    </svg>
    <details><summary>Xem số liệu từng ngày</summary>
      <table><thead><tr><th scope="col">Ngày</th><th scope="col">Volume (kg × rep)</th><th scope="col">Tăng tiến (${unit})</th></tr></thead>
      <tbody>${days.map(day => `<tr><td><time datetime="${day}">${fmt(day)}</time></td><td>${cell(volumeByDay, day)}</td><td>${cell(progressByDay, day)}</td></tr>`).join('')}</tbody></table>
    </details>
  </div>`;
}

function analytics() {
  const start = '2026-11-13';
  const end = todayStr();
  const inPeriod = day => day >= start && day <= end;
  const periodLabel = fmt(start) + ' – ' + fmt(end);
  const group = analyticsFilters.volume;
  const [track, indexText] = analyticsFilters.exercise.split(':');
  const index = Number(indexText);
  const unit = 'kg × rep';
  const groups = group === 'all' ? Object.keys(routines) : [group];
  const totals = new Map();
  for (const r of groups) {
    for (const day of sessions(r).filter(inPeriod)) {
      routines[r].forEach((_, i) => {
        const { volume } = exerciseMetrics(stored(r, day, i));
        if (Number.isFinite(volume)) totals.set(day, (totals.get(day) || 0) + volume);
      });
    }
  }
  const volumePoints = [...totals.keys()].sort().map(day => ({ day, value: totals.get(day) }));
  const history = sessions(track).filter(inPeriod).map(day => ({ day, entry: stored(track, day, index) })).filter(({ entry }) => has(entry));
  const points = history.map(({ day, entry }) => ({ day, value: exerciseMetrics(entry).progress }))
    .filter(point => Number.isFinite(point.value));

  const current = points.at(-1);
  const first = points.length >= 2 ? points[0] : null;
  const delta = first ? current.value - first.value : 0;
  const latest = history.at(-1);
  const target = latest && Number.isFinite(exerciseMetrics(latest.entry).reps) ? suggest(latest.entry) : null;
  const option = (value, label, selected) => '<option value="' + value + '"' + (value === selected ? ' selected' : '') + '>' + esc(label) + '</option>';
  return `<div class="analytics">
    <section class="analytics-panel" aria-labelledby="training-chart-title">
      <h2 id="training-chart-title">Volume và tăng tiến</h2>
      <p class="hint">${end >= start ? periodLabel : 'Bắt đầu từ ' + fmt(start)}</p>
      <div class="chart-filters">
      <label class="chart-filter">Lịch tập <select data-chart="volume">${option('all', 'Tất cả', group)}${Object.keys(routines).map(r => option(r, cap(r), group)).join('')}</select></label>
      <label class="chart-filter">Bài tập <select data-chart="exercise">${Object.entries(routines).map(([r, names]) => '<optgroup label="' + cap(r) + '">' + names.map((name, i) => option(r + ':' + i, name, analyticsFilters.exercise)).join('') + '</optgroup>').join('')}</select></label>
      </div>
      ${combinedChart(volumePoints, points, start, end, unit)}
      <p class="hint">Volume = kg × rep × set khi các set cùng số rep. Với 8/10/10, volume = kg × (8 + 10 + 10). Tăng tiến = kg × số rep cao nhất trong một set.</p>

const tabs = [

  ['nutrition', IC.cal, 'Nutrition'],
  ['stats', IC.stats, 'Analytics'],
  ['settings', IC.set, 'Profile']
];
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const offscreenCards = new WeakMap();
const enteringCards = new WeakSet();
const scrollCards = new IntersectionObserver(entries => {
  if (reducedMotion.matches) return;
  for (const entry of entries) {
    const card = entry.target;
    if (!app.contains(card) || enteringCards.has(card)) continue;
    if (entry.intersectionRatio < .12) {
      const viewportTop = entry.rootBounds?.top ?? 0;
      offscreenCards.set(card, entry.boundingClientRect.top < viewportTop ? -1 : 1);
      continue;
    }
    const direction = offscreenCards.get(card);
    if (!direction) continue;
    offscreenCards.delete(card);
    enteringCards.add(card);
    const animation = card.animate([
      { opacity: .7, translate: `0 ${direction * 16}px` },
      { opacity: 1, translate: '0 0' }
    ], { duration: 360, easing: 'cubic-bezier(.2, .75, .25, 1)' });
    const release = () => enteringCards.delete(card);
    animation.addEventListener('finish', release, { once: true });
    animation.addEventListener('cancel', release, { once: true });
  }
}, { threshold: .12 });

function nav(next, selectedRoutine) {

  if (keyboardTab) app.querySelector('.foot button.active')?.focus({ preventScroll: true });
  if (view === previous || reducedMotion.matches) return;

  const tabIndex = name => tabs.findIndex(([tab]) => tab === (name === 'work' ? 'home' : name));
  const offset = view === 'work' ? '0, 14px' : previous === 'work' && view === 'home' ? '0, -14px'
    : tabIndex(view) < tabIndex(previous) ? '-18px, 0' : '18px, 0';
  for (const section of app.children) {
    if (section.matches('.foot')) continue;
    section.animate([
      { opacity: .38, transform: `translate(${offset})` },

    ], { duration: 250, easing: 'cubic-bezier(.22, .75, .24, 1)' });
  }
}

function refreshScrollEffects() {
  scrollCards.disconnect();
  if (reducedMotion.matches) {
    app.getAnimations({ subtree: true }).forEach(animation => animation.cancel());
  } else if (view === 'work') {
    for (const card of app.querySelectorAll('.exercise, .energy')) {
      offscreenCards.delete(card);

    }

}

function pageIndex(track) {
  return Math.round(track.scrollTop / Math.max(1, track.clientHeight));
}

function renderPagedView(title, subtitle, panels) {
  const previous = app.querySelector(`[data-paged-view="${view}"] .page-track`);
  const page = previous ? pageIndex(previous) : 0;
  const innerScroll = previous?.children[page]?.scrollTop ?? 0;
  app.innerHTML = `<div class="paged-screen" data-paged-view="${view}">
    <div class="dark header"><h1>${title}</h1><p class="sub">${subtitle}</p></div>
    <div class="page-track" tabindex="0" role="region" aria-label="${title}">
      ${panels.map(([name, content]) => `<section class="paged-panel" aria-label="${name}">${content}</section>`).join('')}
    </div>
    <div class="page-dots" role="group" aria-label="Chọn mục">
      ${panels.map(([name]) => `<button type="button" aria-label="${name}"><span></span></button>`).join('')}
    </div>
  </div>${footer(view)}`;
  const track = app.querySelector('.page-track');
  const dots = app.querySelectorAll('.page-dots button');
  let current = -1;
  const markCurrent = () => {
    const active = pageIndex(track);
    if (active === current) return;
    current = active;
    dots.forEach((dot, index) => {
      track.children[index].inert = index !== active;
      if (index === active) dot.setAttribute('aria-current', 'true');
      else dot.removeAttribute('aria-current');
    });
  };
  track.scrollTop = page * track.clientHeight;
  track.children[page].scrollTop = innerScroll;
  markCurrent();
  track.addEventListener('scroll', markCurrent, { passive: true });
  dots.forEach((dot, index) => dot.addEventListener('click', () => track.scrollTo({
    top: index * track.clientHeight,
    behavior: reducedMotion.matches ? 'instant' : 'smooth'
  })));
}

  const eatenAverage = logged.length ? logged.reduce((total, day) => total + meals[day][0], 0) / logged.length : NaN;
  const gymAverage = calendar.reduce((total, day) => total + dayBurn(day), 0) / calendar.length;
  const tdee = baseE() + gymAverage;
  const dailyChange = (eatenAverage - tdee) / 7700;
  const projectedChange = days => {
    const change = dailyChange * days;
    return Number.isFinite(change)
      ? `<strong>${change >= 0 ? '+' : ''}${enFmt(change, 2)}</strong> <span class="nutrition-unit">kg</span>`
      : '<strong>—</strong>';
  };
  const metrics = [
    ['Gym TB', gymAverage],
    ['TDEE TB', tdee],
    ['Calo cần ăn TB', tdee + extraE()],
    ['Calo ăn TB', eatenAverage]
  ];

  return `<section class="weight-forecast" aria-labelledby="forecast-title">
    <h2 id="forecast-title">Dự báo cân nặng</h2>
    <div class="forecast-horizons">
      <div class="forecast-primary">
        <h3>Sau 7 ngày</h3>
        <p class="forecast-reading">${projectedChange(7)}</p>
        <p class="forecast-caption">${logged.length ? 'Thay đổi cân nặng ước tính' : 'Chưa ghi lượng calo đã ăn'}</p>
      </div>
      <div class="forecast-secondary">
        <h3>Sau 30 ngày</h3>
        <p class="forecast-reading">${projectedChange(30)}</p>
      </div>
    </div>
    <div class="forecast-coverage">
      <div><strong>${logged.length}/7 ngày ăn đã ghi</strong><span>${fmt(calendar[0]).slice(0, 5)} – ${fmt(end).slice(0, 5)}</span></div>
      <div class="forecast-days" aria-hidden="true">${calendar.map(day =>
        `<span class="${Object.hasOwn(meals, day) ? 'logged' : ''}"></span>`
      ).join('')}</div>
    </div>
    <section class="forecast-inputs" aria-labelledby="forecast-inputs-title">
      <h3 id="forecast-inputs-title">Trung bình mỗi ngày</h3>
      <dl class="forecast-metrics">${metrics.map(([label, value]) => `
        <div><dt>${label}</dt><dd>${nutritionReading(value, 'kcal')}</dd></div>`).join('')}</dl>
    </section>
    <details class="forecast-method">
      <summary>Cách tính dự báo</summary>
      <p class="hint">Calo ăn bình quân tính theo ngày có ghi bữa ăn. Calo gym bình quân tính trên cả 7 ngày, kể cả ngày nghỉ. Dự báo ước tính thay đổi cân nặng nếu duy trì mức ăn và vận động hiện tại, với quy đổi 7.700 kcal/kg.</p>
    </details>
  </section>`;
}
addEventListener('storage', event => {
  if (event.key === 'dzcalolog' || event.key === null) meals = loadE('dzcalolog', {});
  if (event.key === 'dzGymLogV2' || event.key === null) data = loadE('dzGymLogV2', {});
  else if (event.key !== 'dzGymEnergy') return;
  gym = loadE('dzGymEnergy', {});
  if (view === 'home') render();
  if (view === 'work') allowTrainingEdit(routine);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden || date === todayStr()) return;
  if (view === 'stats') {
    render();
    return;
  }
  closeKeypad();
  nav('home');
});
render();

// Restore original PWA registration; expose errors for debugging.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.info('Service Worker registered:', reg.scope))
      .catch(err => console.error('Service Worker registration failed:', err));
  });
}
</script></body></html>
