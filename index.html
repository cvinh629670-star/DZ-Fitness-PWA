const routines={push:['Landmine Press','Bench Press','Incline Smith Machine Press','Incline Dumbbell Press','Dips','Lateral Raise Combo (Lateral / Front / Overhead Press)','Tricep Extension','Tricep Pushdown'],pull:['Weighted Pull-up','Seated Cable Row','Barbell Row','Face Pull','Rear Delt Cable Fly','Cable Biceps Curl','Hammer Curl','Wrist Combo (Curl / Reverse Curl / Twist)'],leg:['Jump Squat','Deadlift','Leg Press','Lunge Combo','Leg Extension','Leg Curl','Calf Kick','Abs']};const I=p=>`<svg class="i" viewBox="0 0 24 24">${p}</svg>`;const colors={push:'#ff9ea8',pull:'#8edcff',leg:'#a6ed9d'},icons={push:I('<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>'),pull:I('<path d="M3 4h18M8 4v5M16 4v5"/><circle cx="12" cy="12" r="2.6"/><path d="M9 21v-3.5a3 3 0 0 1 6 0V21"/>'),leg:I('<path d="M4 20h5v-5h5v-5h6"/><path d="M15 5h5v5M20 5l-6 6"/>')},IC={cal:I('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'),home:I('<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>'),stats:I('<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'),set:I('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'),next:I('<path d="M9 6l6 6-6 6"/>')};let view='home',routine='push',date=todayStr();let data={};try{data=JSON.parse(localStorage.getItem('dzGymLogV2')||'{}')}catch{}const app=document.getElementById('app');const fmt=d=>d.split('-').reverse().join('/');const key=(r,d,i)=>`${r}_${d}_${i}`;const stored=(r,d,i)=>data[key(r,d,i)]||{};function persist(){localStorage.setItem('dzGymLogV2',JSON.stringify(data))}function nav(v,r){date=todayStr();view=v==='work'&&(!routines[r]||routineRestriction(r,date))?'home':v;if(r)routine=r;render();window.scrollTo(0,0)}function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const has=v=>v&&(v.set||v.rep||v.kg);
function sessions(r){const s=new Set();for(const k of Object.keys(data)){const m=k.match(/^([a-z]+)_(\d{4}-\d\d-\d\d)_\d+$/);if(m&&m[1]===r&&has(data[k]))s.add(m[2])}return[...s].sort()}
function prev(r,i){for(const d of sessions(r).filter(x=>x<date).reverse()){const v=stored(r,d,i);if(has(v))return{...v,d}}return null}
function suggest(p){if(!p)return null;const rs=String(p.rep||'').split(/[\/,\s-]+/).map(parseFloat).filter(n=>!isNaN(n));const kg=parseFloat(String(p.kg||'').replace(',','.'));const set=p.set||'';if(!rs.length)return{set,rep:p.rep||'',kg:p.kg||''};const lo=Math.min(...rs);if(isNaN(kg))return{set,rep:String(lo+1),kg:''};if(lo>=12){const st=kg<20?1:2.5;return{set,rep:'8',kg:String(+(kg+st).toFixed(1))}}return{set,rep:String(lo+1),kg:String(kg)}}
const cap=r=>r[0].toUpperCase()+r.slice(1);function edit(r,i,field,val){if(!allowTrainingEdit(r))return;const k=key(r,date,i);data[k]??={};data[k][field]=val;persist()}const prog=r=>routines[r].filter((_,i)=>{const v=stored(r,date,i);return v.set||v.rep||v.kg}).length;function header(){return `<div class="header"><div class="brand"><div class="logo">${icons.push}</div><div><h1>DZ GYM LOG</h1><div class="sub">Nhật ký tập luyện</div></div></div><div class="range">${IC.cal}<span>${['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'][new Date(date+'T12:00:00').getDay()]}, ${fmt(date)}</span></div></div>`}function footer(active){return `<nav class="foot" aria-label="Điều hướng chính">${[['home',IC.home,'Training'],['nutrition',IC.cal,'Nutrition'],['stats',IC.stats,'Analytics'],['settings',IC.set,'Profile']].map(([v,ic,t])=>`<button class="${active===v?'active':''}" ${active===v?'aria-current="page"':''} onclick="nav('${v}')"><span>${ic}</span>${t}</button>`).join('')}</nav>`}function home(){
  const groups = Object.keys(routines);
  const active = loggedRoutine(date);
  const cards = groups.map(r => {
    const last = sessions(r).filter(d => d < date).pop();
    const progress = prog(r);

    const detail = restriction || (active === r ? `Đang tập · ${progress}/${size} bài đã ghi` : last ? "Lần trước " + fmt(last).slice(0, 5) : "Chưa ghi buổi trước");
    return `<button class="workcard ${r}" ${restriction ? 'disabled' : `onclick="nav('work','${r}')"`}>

  }).join("");
  app.innerHTML = `<div class="home">${header()}
    <section class="hero" aria-labelledby="today-title">
      <img src="training-hero.jpg?v=7954d46" alt="" fetchpriority="high">
      <div><h2 id="today-title">Tập luyện<br>hôm nay</h2><p>${active ? `${cap(active)} · ${prog(active)}/${routines[active].length} bài đã ghi` : 'Chọn một lịch tập cho hôm nay'}</p>
      ${active ? `<em class="bar hero-meter" aria-hidden="true"><u style="width:${prog(active) / routines[active].length * 100}%"></u></em>` : ''}</div>
    </section>
    <h2 class="section-title">Lịch tập</h2><div class="cards">${cards}</div>
  </div>${footer("home")}`;
}
function loggedRoutine(day) {
  return dayTypes(day)[0] || Object.keys(routines).find(r => gym[r + '_' + day]);
}
function offsetTrainingDay(day, offset) {
  const shifted = new Date(day + 'T00:00:00Z');
  shifted.setUTCDate(shifted.getUTCDate() + offset);
  return shifted.toISOString().slice(0, 10);

function routineRestriction(r, day) {
  const active = loggedRoutine(day);
  if (active === r) return '';
  if (active) return `Hôm nay đã ghi ${cap(active)}`;
  for (const offset of [1, 2]) {
    const previous = offsetTrainingDay(day, -offset);
    if (dayTypes(previous).includes(r) || gym[r + '_' + previous]) {
      return `Tập lại từ ${fmt(offsetTrainingDay(previous, 3))}`;

}
function allowTrainingEdit(r) {
  if (date === todayStr() && !routineRestriction(r, date)) return true;
  closeKeypad();
  nav('home');
  return false;
}
function work(){const ls=sessions(routine).filter(d=>d<date).pop();const sgs=routines[routine].map((_,i)=>suggest(prev(routine,i)));app.innerHTML=`<div class="top ${routine}"><div class="topline"><button class="back" aria-label="Về trang chủ" onclick="nav('home')">‹</button><span class="ticon">${icons[routine]}</span><div><h2>${cap(routine)}</h2><p>Hôm nay ${fmt(date)}${ls?' · lần trước '+fmt(ls).slice(0,5):' · buổi đầu tiên'}</p></div></div><div class="tprog"><span>${prog(routine)}/8 bài đã ghi</span><em class="bar"><u style="width:${prog(routine)*12.5}%"></u></em></div></div><div class="paper" style="--ac:${colors[routine]}">${sgs.some(Boolean)?`<button class="sugall" onclick="document.querySelectorAll('.sug').forEach(b=>b.click())">Dùng tất cả gợi ý cho hôm nay</button>`:''}${routines[routine].map((name,i)=>{const d=stored(routine,date,i),p=prev(routine,i),sg=sgs[i];return `<div class="exercise${has(d)?' done':''}" data-i="${i}"><div class="exhead"><span class="n">${i+1}</span><label>${name}</label></div><div class="exbody"><div class="prevcol">${p?`<small>Lần trước · ${fmt(p.d).slice(0,5)}</small><b>${esc(p.set||'–')}×${esc(p.rep||'–')}</b><em>${p.kg?esc(p.kg)+' kg':'tạ thân'}</em>`:`<small>Lần trước</small><em>Chưa có</em>`}</div><input aria-label="Số set ${name}" readonly inputmode="none" placeholder="Set" value="${esc(d.set||'')}" oninput="edit('${routine}',${i},'set',this.value)"><input aria-label="Số rep ${name}" readonly inputmode="none" placeholder="Rep" value="${esc(d.rep||'')}" oninput="edit('${routine}',${i},'rep',this.value)"><input aria-label="Số kg ${name}" readonly inputmode="none" placeholder="Kg" value="${esc(d.kg||'')}" oninput="edit('${routine}',${i},'kg',this.value)"></div>${sg?`<button class="sug" type="button"><b>Gợi ý hôm nay: ${esc(sg.set||'–')}×${esc(sg.rep||'–')} · ${sg.kg?esc(sg.kg)+' kg':'tạ thân'}</b><span>Dùng</span></button>`:''}</div>`}).join('')}${gymPanel()}<button class="save ${routine}" onclick="if(!allowTrainingEdit(routine))return;persist();this.textContent='✓ Đã lưu';setTimeout(()=>this.textContent='✓ Lưu bài tập',1200)">✓ Lưu bài tập</button><p class="mini">Dữ liệu tự lưu khi nhập. Lần sau tập ${cap(routine)}, số liệu hôm nay sẽ hiện ở cột "Lần trước". Gợi ý: đạt 12 rep thì tăng tạ (2.5 kg, hoặc 1 kg nếu dưới 20 kg) và về 8 rep; chưa đạt thì giữ tạ và thêm 1 rep. Bạn vẫn sửa tự do. Rep nhập dạng 8, 8/10/10 hoặc Max.</p></div>${footer('')}`};
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}function count(){return Object.keys(data).filter(k=>Object.values(data[k]||{}).some(v=>String(v).trim())).length}function dayTypes(d){return Object.keys(routines).filter(r=>routines[r].some((_,i)=>{let v=stored(r,d,i);return v.set||v.rep||v.kg}))}function stats(){const per=Object.keys(routines).map(r=>({r,n:sessions(r).length,last:sessions(r).pop()}));const mx=Math.max(1,...per.map(p=>p.n));app.innerHTML=`<div class="dark header"><h1>Thống kê</h1><p class="sub">Số buổi đã tập theo từng lịch</p></div><div class="settings"><h2>${new Set(per.flatMap(p=>sessions(p.r))).size} ngày đã ghi</h2>${per.map(({r,n,last})=>`<div class="srow"><i class="${r}">${icons[r]}</i><div><strong>${cap(r)} <small class="hint">· gần nhất ${last?fmt(last).slice(0,5):'chưa có'}</small></strong><em class="bar"><u style="width:${n*100/mx}%;background:${colors[r]}"></u></em></div><b>${n}</b></div>`).join('')}<p class="hint">Mỗi buổi là một ngày có ghi ít nhất một bài của lịch đó.</p>${energyForecast()}${analytics()}</div>${footer('stats')}`};function settings(){app.innerHTML=`<div class="dark header"><h1>Cài đặt</h1><p class="sub">Quản lý dữ liệu tập luyện</p></div><div class="settings">${profilePanel()}${installed()?'':`<button class="install" onclick="installApp()">Cài app lên màn hình chính</button>`}<button onclick="exportJSON()">Sao lưu dữ liệu (JSON)</button><label class="filebtn">Khôi phục từ file sao lưu<input type="file" accept=".json,application/json" hidden onchange="importJSON(this.files[0])"></label><button onclick="exportCSV()">Xuất dữ liệu CSV</button><button class="danger" onclick="if(confirm('Xóa toàn bộ dữ liệu đã ghi?')){data={};persist();render()}">Xóa toàn bộ ghi chú</button><p class="hint">Dữ liệu lưu trên trình duyệt hiện tại. Nếu xóa dữ liệu trình duyệt, ghi chú có thể mất. Hãy xuất CSV để sao lưu.</p></div>${footer('settings')}`};function exportCSV(){const rows=[['Lịch','Ngày','Bài tập','Set','Rep','Kg']];for(const r of Object.keys(routines))for(const day of sessions(r))routines[r].forEach((name,i)=>{const v=stored(r,day,i);if(has(v))rows.push([r,day,name,v.set||'',v.rep||'',v.kg||''])});const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='DZ-Gym-Log.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}const analyticsFilters = { volume: 'all', exercise: 'push:0' };
const chartNumber = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 2 });

function recordedNumber(value) {
  const text = String(value ?? '').trim();
  return /^\d+(?:[.,]\d+)?$/.test(text) ? Number(text.replace(',', '.')) : NaN;
}

function exerciseMetrics(entry) {
  const weight = recordedNumber(entry.kg);
  const sets = recordedNumber(entry.set);
  const repText = String(entry.rep ?? '').trim();
  const reps = repText.split('/').map(recordedNumber);
  const validReps = reps.every(value => Number.isInteger(value) && value > 0);
  const maxReps = validReps ? Math.max(...reps) : NaN;
  const validSets = Number.isInteger(sets) && sets > 0;
  let total = NaN;
  if (validReps && reps.length > 1 && (!String(entry.set ?? '').trim() || sets === reps.length)) {
    total = reps.reduce((sum, value) => sum + value, 0);
  } else if (validReps && reps.length === 1 && validSets) {
    total = sets * reps[0];
  }
  return {
    weight,
    reps: maxReps,
    volume: weight > 0 ? weight * total : NaN,
    progress: weight > 0 ? weight * maxReps : NaN
  };
}

function combinedChart(volume, progress, start, end, unit) {
  if (!volume.length && !progress.length) return '<p class="hint">Chưa có số liệu phù hợp trong khoảng này.</p>';
  const dayOffset = day => (Date.parse(day) - Date.parse(start)) / 86400000;
  const toPairs = points => points.map(({ day, value }) => [dayOffset(day), value]);
  const [[volumeTicks, volumeCoords], [progressTicks, progressCoords], dates, left, right, bottom] =
    trainingChart.layout(toPairs(volume), toPairs(progress), dayOffset(end));
  const grid = volumeTicks.map(([, y]) => `<line x1="${left}" x2="${right}" y1="${y}" y2="${y}"/>`).join('');
  const guideTops = new Map();
  for (const [x, y] of [...volumeCoords, ...progressCoords]) {
    guideTops.set(x, Math.min(y, guideTops.get(x) ?? bottom));
  }
  const guides = Array.from(guideTops, ([x, y]) =>
    `<path d="M ${x} ${y} V ${bottom}"/><path class="chart-day-tick" d="M ${x} ${bottom} v 4"/>`
  ).join('');
  const axis = (ticks, x, anchor, color) => `<g class="${color}">${ticks.map(([value, y]) =>
    `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle">${chartNumber.format(value)}</text>`
  ).join('')}</g>`;
  const labels = dates.map(([offset, x]) =>
    `<text x="${x}" y="${bottom + 19}" text-anchor="middle">${fmt(offsetTrainingDay(start, offset)).slice(0, 5)}</text>`
  ).join('');
  const draw = (coords, points, pointUnit, color) => `<g class="${color}">
    <polyline points="${coords.map(([x, y]) => `${x},${y}`).join(' ')}"/>
    ${coords.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="3.6"><title>${fmt(points[i].day)} · ${chartNumber.format(points[i].value)} ${pointUnit}</title></circle>`).join('')}
  </g>`;
  const volumeByDay = new Map(volume.map(({ day, value }) => [day, value]));
  const progressByDay = new Map(progress.map(({ day, value }) => [day, value]));
  const days = [...new Set([...volumeByDay.keys(), ...progressByDay.keys()])].sort();
  const cell = (values, day) => values.has(day) ? chartNumber.format(values.get(day)) : '—';
  return `<div class="line-chart">
    <div class="chart-legend">
      <span class="chart-volume">Volume · kg × rep${volume.length ? '' : ' · Chưa có dữ liệu'}</span>
      <span class="chart-progress">Tăng tiến · ${unit}${progress.length ? '' : ' · Chưa có dữ liệu'}</span>
    </div>
    <svg viewBox="0 0 400 198" aria-hidden="true">
      ${volume.length ? `<g class="chart-volume"><text x="${left - 7}" y="13" text-anchor="end">kg × rep</text></g>` : ''}
      ${progress.length ? `<g class="chart-progress"><text x="${right + 7}" y="13">${unit}</text></g>` : ''}
      <g class="chart-grid">${grid}</g><g class="chart-guides">${guides}</g>${labels}
      ${volume.length ? axis(volumeTicks, left - 7, 'end', 'chart-volume') + draw(volumeCoords, volume, 'kg × rep', 'chart-volume') : ''}
      ${progress.length ? axis(progressTicks, right + 7, 'start', 'chart-progress') + draw(progressCoords, progress, unit, 'chart-progress') : ''}
    </svg>
    <details><summary>Xem số liệu từng ngày</summary>
      <table><thead><tr><th scope="col">Ngày</th><th scope="col">Volume (kg × rep)</th><th scope="col">Tăng tiến (${unit})</th></tr></thead>
      <tbody>${days.map(day => `<tr><td><time datetime="${day}">${fmt(day)}</time></td><td>${cell(volumeByDay, day)}</td><td>${cell(progressByDay, day)}</td></tr>`).join('')}</tbody></table>
    </details>
  </div>`;
}

function analytics() {
  const start = '2026-11-13';
  const end = todayStr();
  const inPeriod = day => day >= start && day <= end;
  const periodLabel = fmt(start) + ' – ' + fmt(end);
  const group = analyticsFilters.volume;
  const [track, indexText] = analyticsFilters.exercise.split(':');
  const index = Number(indexText);
  const unit = 'kg × rep';
  const groups = group === 'all' ? Object.keys(routines) : [group];
  const totals = new Map();
  for (const r of groups) {
    for (const day of sessions(r).filter(inPeriod)) {
      routines[r].forEach((_, i) => {
        const { volume } = exerciseMetrics(stored(r, day, i));
        if (Number.isFinite(volume)) totals.set(day, (totals.get(day) || 0) + volume);
      });
    }
  }
  const volumePoints = [...totals.keys()].sort().map(day => ({ day, value: totals.get(day) }));
  const history = sessions(track).filter(inPeriod).map(day => ({ day, entry: stored(track, day, index) })).filter(({ entry }) => has(entry));
  const points = history.map(({ day, entry }) => ({ day, value: exerciseMetrics(entry).progress }))
    .filter(point => Number.isFinite(point.value));

  const current = points.at(-1);
  const first = points.length >= 2 ? points[0] : null;
  const delta = first ? current.value - first.value : 0;
  const latest = history.at(-1);
  const target = latest && Number.isFinite(exerciseMetrics(latest.entry).reps) ? suggest(latest.entry) : null;
  const option = (value, label, selected) => '<option value="' + value + '"' + (value === selected ? ' selected' : '') + '>' + esc(label) + '</option>';
  return `<div class="analytics">
    <section class="analytics-panel" aria-labelledby="training-chart-title">
      <h2 id="training-chart-title">Volume và tăng tiến</h2>
      <p class="hint">${end >= start ? periodLabel : 'Bắt đầu từ ' + fmt(start)}</p>
      <div class="chart-filters">
      <label class="chart-filter">Lịch tập <select data-chart="volume">${option('all', 'Tất cả', group)}${Object.keys(routines).map(r => option(r, cap(r), group)).join('')}</select></label>
      <label class="chart-filter">Bài tập <select data-chart="exercise">${Object.entries(routines).map(([r, names]) => '<optgroup label="' + cap(r) + '">' + names.map((name, i) => option(r + ':' + i, name, analyticsFilters.exercise)).join('') + '</optgroup>').join('')}</select></label>
      </div>
      ${combinedChart(volumePoints, points, start, end, unit)}
      <p class="hint">Volume = kg × rep × set khi các set cùng số rep. Với 8/10/10, volume = kg × (8 + 10 + 10). Tăng tiến = kg × số rep cao nhất trong một set.</p>
      ${volumePoints.length ? '<p class="hint">Tổng volume: <strong>' + chartNumber.format(volumePoints.reduce((sum, point) => sum + point.value, 0)) + '</strong> kg × rep</p>' : ''}
      ${current ? '<p class="progress-summary">Gần nhất <strong>' + chartNumber.format(current.value) + ' ' + unit + '</strong> · ' + fmt(current.day) + (first ? '<br>So với buổi đầu kỳ ' + fmt(first.day) + ': <strong>' + (delta > 0 ? '+' : '') + chartNumber.format(delta) + ' ' + unit + '</strong>' : '') + '</p>' : ''}
      ${target ? '<p class="progress-target"><strong>Gợi ý buổi sau</strong><br>' + (target.set ? esc(target.set) + ' set · ' : '') + esc(target.rep) + ' rep · ' + (target.kg ? esc(target.kg) + ' kg' : 'tạ thân') + '</p>' : ''}
    </section>
  </div>`;
}

document.addEventListener('change', event => {
  const filter = event.target.dataset.chart;
  if (!Object.hasOwn(analyticsFilters, filter)) return;
  analyticsFilters[filter] = event.target.value;
  document.querySelector('.analytics').outerHTML = analytics();
  document.querySelector('[data-chart="' + filter + '"]').focus({ preventScroll: true });
});
let analyticsDayTimer;
function render() {
  clearTimeout(analyticsDayTimer);
  date = todayStr();
  if (view === 'work' && routineRestriction(routine, date)) view = 'home';
  ({ home, work, stats, settings, nutrition }[view] || home)();
  if (view === 'stats') {
    const midnight = new Date();
    midnight.setHours(24, 0, 0, 0);
    analyticsDayTimer = setTimeout(render, midnight.getTime() - Date.now());
  }
}

// Inputs are read-only on purpose: use our 0–9 keypad instead of the phone keyboard.
let keypadInput=null;
function closeKeypad(){document.getElementById('gymKeypad')?.remove();keypadInput=null}
function openKeypad(el){
 if(keypadInput===el)return;
 closeKeypad();keypadInput=el;
 const row=el.closest('.exercise');const name=row?.querySelector('label')?.textContent||'Bài tập';
 const field=el.getAttribute('aria-label')||'';
 const repField=el.placeholder==='Rep';
 const modal=document.createElement('div');modal.id='gymKeypad';modal.className='keypad-overlay';
 modal.innerHTML=`<div class="keypad-panel" role="dialog" aria-modal="true" aria-label="Bàn phím nhập số"><div class="keypad-top"><div><div class="keypad-title">${esc(name)}</div><div class="keypad-sub">${esc(field.startsWith('Số set')?'Số set':field.startsWith('Số rep')?'Số rep':'Mức tạ (kg)')}</div></div><button class="keypad-close" type="button" data-key="done" aria-label="Đóng">×</button></div><div class="keypad-display" id="keypadValue"></div><div class="keypad-grid">${['1','2','3','4','5','6','7','8','9',repField?'/' : '.','0','⌫'].map(x=>`<button type="button" data-key="${x==='⌫'?'back':x}" class="${x==='⌫'?'key-del':''}">${x}</button>`).join('')}</div><div class="keypad-actions"><button type="button" data-key="clear">Xóa hết</button><button type="button" class="key-done" data-key="done">✓ Xong</button></div></div>`;
 modal.addEventListener('click',e=>{if(e.target===modal)closeKeypad()});
 modal.querySelectorAll('[data-key]').forEach(btn=>btn.addEventListener('click',()=>keypadPress(btn.dataset.key)));
 document.body.append(modal);updateKeypadDisplay();
}
function updateKeypadDisplay(){const display=document.getElementById('keypadValue');if(display)display.textContent=keypadInput?.value||'—'}
function keypadPress(k){if(!keypadInput)return;navigator.vibrate?.(8);if(k==='done'){closeKeypad();return}
 let v=keypadInput.value;
 if(k==='clear')v='';else if(k==='back')v=v.slice(0,-1);else if(k==='/'&&keypadInput.placeholder==='Rep'){if(/\d$/.test(v)&&v.length<32)v+='/'}else if(k==='.'&&keypadInput.placeholder!=='Rep') {if(!v.includes('.'))v=(v||'0')+'.'}else if(/^\d$/.test(k)&&v.length<(keypadInput.placeholder==='Rep'?32:9))v+=k;
 keypadInput.value=v;keypadInput.dispatchEvent(new Event('input',{bubbles:true}));updateKeypadDisplay();
}
document.addEventListener('click',e=>{const el=e.target.closest?.('.exercise input[readonly]');if(el)openKeypad(el)});
document.addEventListener('keydown',e=>{if(!keypadInput)return;if(e.key==='Escape'){closeKeypad();return}if(e.key==='Backspace'){keypadPress('back');return}if(e.key==='Enter'){closeKeypad();return}if(/^[0-9./]$/.test(e.key)){e.preventDefault();keypadPress(e.key)}});
document.addEventListener('input',e=>{const row=e.target.closest?.('.exercise');if(!row)return;row.classList.toggle('done',[...row.querySelectorAll('input')].some(x=>x.value.trim()));const n=document.querySelectorAll('.exercise.done').length,t=document.querySelector('.tprog');if(t){t.querySelector('span').textContent=n+'/8 bài đã ghi';t.querySelector('u').style.width=n*12.5+'%'}});
document.addEventListener('click',e=>{const b=e.target.closest?.('.sug');if(!b||!allowTrainingEdit(routine))return;const row=b.closest('.exercise'),s=suggest(prev(routine,+row.dataset.i));if(!s)return;const ins=row.querySelectorAll('input');[s.set,s.rep,s.kg].forEach((v,k)=>{if(v!==''&&v!=null){ins[k].value=v;ins[k].dispatchEvent(new Event('input',{bubbles:true}))}})});
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e});
function installed(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone}
function installApp(){if(dip){dip.prompt();dip=null}else alert('iPhone (Safari): nút Chia sẻ → Thêm vào MH chính.\nAndroid (Chrome): menu ⋮ → Cài đặt ứng dụng / Thêm vào màn hình chính.')}
function exportJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='DZ-Gym-Log-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importJSON(f){if(!f)return;f.text().then(t=>{try{const x=JSON.parse(t);if(!x||typeof x!=='object')throw 0;Object.assign(data,x);persist();alert('Đã khôi phục dữ liệu');render()}catch{alert('File sao lưu không hợp lệ')}})}

navigator.storage?.persist?.();

const loadE=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
let ep={sex:5,age:20,height:179,weight:62,goal:70,days:90,activity:1.35,...loadE('dzEnergyProfile',{})}, meals=loadE('dzcalolog',{}), gym=loadE('dzGymEnergy',{});
function saveE(){localStorage.setItem('dzEnergyProfile',JSON.stringify(ep));localStorage.setItem('dzcalolog',JSON.stringify(meals));localStorage.setItem('dzGymEnergy',JSON.stringify(gym))}
const enFmt=(n,d=0)=>Number(n).toLocaleString('vi-VN',{maximumFractionDigits:d});const et=(a,b)=>`<div class="etile"><small>${a}</small><b>${b}</b></div>`;
function baseE(){return (10*ep.weight+6.25*ep.height-5*ep.age+ep.sex)*ep.activity}function burn(x){return Math.max(0,(x.met-1)*3.5*x.weight/200*x.minutes)}function dayBurn(d){return Object.entries(gym).filter(([k])=>k.endsWith('_'+d)).reduce((a,[k,x])=>a+burn(x),0)}function extraE(){return (ep.goal-ep.weight)*7700/ep.days}function targetE(d){return baseE()+dayBurn(d)+extraE()}
function profilePanel(){return `<section class="energy"><h2>BODY PROFILE</h2><form onsubmit="saveProfile(event)"><div class="energygrid">${[['age','Tuổi',18,100],['height','Chiều cao cm',100,250],['weight','Cân nặng kg',30,300],['goal','Mục tiêu kg',30,300],['days','Thời gian ngày',1,3650]].map(([k,t,min,max])=>`<label>${t}<input name="${k}" type="number" min="${min}" max="${max}" step="any" required value="${ep[k]}"></label>`).join('')}<label>Giới tính<select name="sex"><option value="5" ${ep.sex===5?'selected':''}>Nam</option><option value="-161" ${ep.sex===-161?'selected':''}>Nữ</option></select></label></div><label>Vận động ngoài gym<select name="activity">${[[1.2,'Ít vận động'],[1.35,'Đi lại nhẹ'],[1.5,'Đi lại nhiều'],[1.7,'Lao động nặng']].map(([v,t])=>`<option value="${v}" ${ep.activity===v?'selected':''}>${t}</option>`).join('')}</select></label><button>Lưu hồ sơ</button></form><div class="energygrid">${et('BMR',enFmt(baseE()/ep.activity))}${et('TDEE ngoài gym',enFmt(baseE()))}${et('Calo cần ăn hôm nay',enFmt(targetE(todayStr())))}${et('Protein tham khảo',enFmt(ep.weight*1.6)+'–'+enFmt(ep.weight*2.2)+' g')}</div><p class="hint">Mục tiêu chênh lệch ${enFmt(extraE())} kcal/ngày. ${Math.abs(extraE())>750?'Mục tiêu khá gấp; nên kéo dài thời gian.':''} TDEE nền không gồm gym.</p></section>`}
function saveProfile(e){e.preventDefault();for(const [k,v] of new FormData(e.target))ep[k]=Number(v);saveE();render()}
function gymPanel(){let x=gym[routine+'_'+date]||{minutes:60,met:3.5};return `<section class="energy"><h2>GYM ENERGY</h2><form onsubmit="saveGym(event)"><label>Thời lượng cả buổi (phút, gồm nghỉ)<input name="minutes" type="number" min="1" max="300" required value="${x.minutes}"></label><label>Cường độ trung bình<select name="met">${[[3.5,'Tập tạ vừa · 3.5 MET'],[5,'Tập nặng · 5 MET'],[6,'Tập rất nặng · 6 MET']].map(([v,t])=>`<option value="${v}" ${x.met===v?'selected':''}>${t}</option>`).join('')}</select></label><button>Lưu calo buổi tập</button></form><div class="energygrid">${et('Calo gym ròng đã lưu',gym[routine+'_'+date]?enFmt(burn(gym[routine+'_'+date])):'—')}${et('Cần ăn hôm nay',enFmt(targetE(date)))}</div><button onclick="deleteGym()">Xóa calo buổi này</button><p class="hint">Ước tính MET theo thời lượng và cân nặng; không quy đổi trực tiếp volume tạ sang kcal. Chỉ cộng phần tiêu hao trên mức nghỉ.</p></section>`}
function saveGym(e){e.preventDefault();if(!allowTrainingEdit(routine))return;let f=new FormData(e.target);gym[routine+'_'+date]={minutes:+f.get('minutes'),met:+f.get('met'),weight:ep.weight};saveE();render()}function deleteGym(){if(!allowTrainingEdit(routine))return;delete gym[routine+'_'+date];saveE();render()}
function nutrition(){let d=todayStr(),a=meals[d];app.innerHTML=`<div class="dark header"><h1>NUTRITION</h1><p class="sub">Năng lượng & dưỡng chất</p></div><div class="settings"><section class="energy"><h2>HÔM NAY</h2><div class="energygrid">${et('TDEE nền',enFmt(baseE()))}${et('Gym ròng',enFmt(dayBurn(d)))}${et('TDEE hôm nay',enFmt(baseE()+dayBurn(d)))}${et('Cần ăn',enFmt(targetE(d)))}${et('Đã ăn',a?enFmt(a[0]):'—')}${et('Còn thiếu theo mục tiêu',a?enFmt(Math.max(0,targetE(d)-a[0])):'—')}${['Protein','Carb','Fat'].map((t,i)=>et(t,a?enFmt(a[i+1])+' g':'—')).join('')}</div></section><section class="energy"><h2>IMPORT TXT</h2><input type="file" accept=".txt,text/plain" onchange="readMeal(this)"><textarea id="mealRaw" placeholder="${d};2260;92;276;87"></textarea><button onclick="importMeal()">Nhập dữ liệu</button><button onclick="downloadE('mau-dinh-duong.txt','# Ngày;Calo;Protein;Carb;Fat\n'+todayStr()+';2260;92;276;87')">Tải mẫu TXT</button><button onclick="downloadE('nhat-ky.txt',Object.keys(meals).sort().map(k=>[k,...meals[k]].join(';')).join('\n'))">Xuất nhật ký</button><p class="hint">Ngày;Calo;Protein;Carb;Fat — macro tính bằng gram. Ngày trùng được cập nhật.</p><p id="mealMsg" role="status"></p></section><section class="energy"><h2>NHẬT KÝ</h2><table><thead><tr><th>Ngày</th><th>Kcal</th><th>P</th><th>C</th><th>F</th><th></th></tr></thead><tbody>${Object.keys(meals).sort().reverse().map(k=>`<tr><td>${esc(k)}</td>${meals[k].map(v=>`<td>${enFmt(v,1)}</td>`).join('')}<td><button onclick="removeMeal('${k}')">×</button></td></tr>`).join('')}</tbody></table></section></div>${footer('nutrition')}`}
async function readMeal(el){if(el.files[0])document.getElementById('mealRaw').value=await el.files[0].text()}function importMeal(){let pending={},errors=[];document.getElementById('mealRaw').value.split(/\r?\n/).forEach((l,i)=>{l=l.trim();if(!l||l.startsWith('#'))return;let [k,...v]=l.split(';').map(x=>x.trim());if(!/^\d{4}-\d\d-\d\d$/.test(k)||!Number.isFinite(Date.parse(k))||new Date(k).toISOString().slice(0,10)!==k||v.length!==4||v.some(x=>!x||!Number.isFinite(+x)||+x<0)){errors.push(i+1);return}pending[k]=v.map(Number)});if(errors.length||!Object.keys(pending).length){document.getElementById('mealMsg').textContent=errors.length?'Lỗi dòng '+errors.join(', '):'Chưa có dữ liệu';return}Object.assign(meals,pending);saveE();render();document.getElementById('mealMsg').textContent='Đã nhập '+Object.keys(pending).length+' ngày'}function removeMeal(k){if(confirm('Xóa ngày '+k+'?')){delete meals[k];saveE();render()}}function downloadE(n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function energyForecast(){let end=todayStr(),start=new Date(end+'T12:00:00');start.setDate(start.getDate()-6);let keys=Object.keys(meals).filter(k=>k<=end&&Date.parse(k)>=Date.parse(end)-6*86400000),avg=keys.length?keys.reduce((s,k)=>s+meals[k][0],0)/keys.length:0,gavg=Object.entries(gym).filter(([k])=>{let d=k.slice(-10);return d<=end&&Date.parse(d)>=Date.parse(end)-6*86400000}).reduce((s,[k,x])=>s+burn(x),0)/7,t=baseE()+gavg,delta=(avg-t)/7700;return `<section class="energy"><h2>WEIGHT FORECAST</h2><div class="energygrid">${et('Gym TB / ngày',enFmt(gavg))}${et('TDEE TB / ngày',enFmt(t))}${et('Calo cần ăn TB',enFmt(t+extraE()))}${et('Calo ăn TB',keys.length?enFmt(avg):'—')}${[7,30].map(n=>et('Sau '+n+' ngày',keys.length?(delta>=0?'+':'')+enFmt(delta*n,2)+' kg':'—')).join('')}</div><p class="hint">${keys.length}/7 ngày ăn đã ghi. Gym lấy tổng 7 ngày chia 7; ngày chưa ghi gym được giả định nghỉ. Dự báo giả định tiếp tục mức ăn và vận động này, dùng 7.700 kcal/kg; không phải dự báo tăng cơ.</p></section>`}
addEventListener('storage', event => {
  if (event.key === 'dzGymLogV2' || event.key === null) data = loadE('dzGymLogV2', {});
  else if (event.key !== 'dzGymEnergy') return;
  gym = loadE('dzGymEnergy', {});
  if (view === 'home') render();
  if (view === 'work') allowTrainingEdit(routine);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden || date === todayStr()) return;
  if (view === 'stats') {
    render();
    return;
  }
  closeKeypad();
  nav('home');
});
render();

// Restore original PWA registration; expose errors for debugging.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.info('Service Worker registered:', reg.scope))
      .catch(err => console.error('Service Worker registration failed:', err));
  });
}
</script></body></html>
